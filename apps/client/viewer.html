<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ship Viewer // Command Prompt</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05080d; color: #cfe4f2; font: 12px/1.4 ui-monospace, Menlo, monospace; overflow: hidden; }
      #viewer { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #labels .label { position: fixed; transform: translate(-50%, -100%); padding: 2px 6px; background: rgba(4, 10, 16, 0.72); border: 1px solid rgba(120, 190, 230, 0.35); pointer-events: none; white-space: nowrap; letter-spacing: 0.06em; text-transform: uppercase; }
      #info { position: fixed; left: 12px; bottom: 10px; right: 12px; opacity: 0.75; white-space: pre-wrap; }
      #help { position: fixed; left: 12px; top: 10px; opacity: 0.75; }
    </style>
  </head>
  <body>
    <canvas id="viewer"></canvas>
    <div id="labels"></div>
    <div id="help">SHIP VIEWER · drag to orbit · wheel to zoom · ?class=cruiser · ?lod=close|medium|large|far · ?team=1-8</div>
    <div id="info"></div>
    <script type="module" src="/src/ship-viewer.ts"></script>
  </body>
</html>
